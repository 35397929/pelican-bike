<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>鹈鹕骑车</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23e5432a'/%3E%3Cpath d='M12 32 Q24 18 42 28 L54 20 L50 32 L54 44 L42 36 Q24 46 12 32Z' fill='%23f6ecd6'/%3E%3C/svg%3E">
<style>
:root{
  --paper:#f6ecd6;--ink:#1c2a4d;--red:#e5432a;--teal:#1d8a8c;--sun:#f5b532;
  --display:"Noto Serif SC","Source Han Serif SC","Songti SC","STZhongsong","SimSun",serif;
  --note:"KaiTi","STKaiti","Kaiti SC",serif;
  --num:"Bahnschrift","DIN Alternate","Arial Narrow","Microsoft YaHei UI",sans-serif;
  --ui:"Noto Sans SC","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--ink)}
body{font-family:var(--ui);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:pointer}
b{font-weight:inherit}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;
  padding:clamp(10px,2.6vh,24px) clamp(12px,2.4vw,30px);opacity:0;visibility:hidden;translate:0 -14px;transition:opacity .3s,translate .3s,visibility 0s .3s}
body[data-mode="play"] #hud,body[data-mode="crash"] #hud,body[data-mode="pause"] #hud{opacity:1;visibility:visible;translate:0 0;transition:opacity .3s,translate .3s}
.hud-l{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(8px,1.6vh,14px)}
.meter{display:flex;align-items:baseline;gap:.1em;font-family:var(--num);font-weight:700;font-stretch:75%;font-size:clamp(46px,10.5vh,92px);line-height:.82;
  color:var(--paper);letter-spacing:.02em;font-variant-numeric:tabular-nums;
  text-shadow:3px 0 0 var(--ink),-3px 0 0 var(--ink),0 3px 0 var(--ink),0 -3px 0 var(--ink),2.2px 2.2px 0 var(--ink),-2.2px 2.2px 0 var(--ink),2.2px -2.2px 0 var(--ink),-2.2px -2.2px 0 var(--ink),0 7px 0 var(--ink)}
.meter i{font-style:normal;font-size:.36em;letter-spacing:.08em}
.chip{display:inline-flex;align-items:center;gap:.45em;font-family:var(--num);font-weight:700;font-size:clamp(15px,2.9vh,22px);line-height:1;color:var(--ink);
  background:var(--paper);border:2.5px solid var(--ink);border-radius:999px;padding:.36em .85em .3em .65em;box-shadow:0 3px 0 var(--ink);font-variant-numeric:tabular-nums}
.chip .ico{width:1.75em;height:1.05em;display:block;overflow:visible}
.chip .ico path{fill:#5fc7d8;stroke:var(--ink);stroke-width:2.6;stroke-linejoin:round}
.chip .ico circle{fill:var(--ink)}
.chip.bump{animation:bump .28s ease-out}
.chip.best{font-family:var(--ui);font-size:clamp(12px,2.2vh,15px);padding:.55em 1em .5em;letter-spacing:.14em}
.chip.best b{font-family:var(--num);font-size:1.3em;letter-spacing:.02em}
.dash{display:none;align-items:center;gap:.6em;font-family:var(--note);font-weight:700;font-size:clamp(15px,2.8vh,20px);letter-spacing:.1em;color:var(--paper);
  text-shadow:0 2px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.dash.on{display:flex}
.dash span{position:relative;display:block;width:clamp(96px,14vw,170px);height:.8em;border:2.5px solid var(--ink);border-radius:99px;background:var(--paper);overflow:hidden}
.dash span::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(-55deg,var(--sun) 0 8px,var(--red) 8px 16px);transform-origin:left;transform:scaleX(var(--v,1))}
.hud-r{display:flex;align-items:center;gap:clamp(6px,1vw,10px)}
.rbtn{pointer-events:auto;width:clamp(34px,6.2vh,46px);height:clamp(34px,6.2vh,46px);border-radius:50%;border:2.5px solid var(--ink);background:var(--paper);color:var(--ink);
  display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 0 var(--ink);transition:translate .08s,box-shadow .08s,opacity .2s;outline:none;padding:0}
.rbtn:active{translate:0 3px;box-shadow:0 0 0 var(--ink)}
.rbtn svg{width:58%;height:58%;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.rbtn .b{display:none}.rbtn.off .a{display:none}.rbtn.off .b{display:inline}
.rbtn.off{background:var(--ink);color:var(--paper)}
.rbtn.cd{opacity:.45}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:0;visibility:hidden;transition:opacity .3s,visibility 0s .3s}
body[data-mode="title"] #title,body[data-mode="over"] #over,body[data-mode="pause"] #pause{opacity:1;visibility:visible;transition:opacity .3s}

#title .tb{position:absolute;left:clamp(18px,5.5vw,92px);top:clamp(14px,6vh,68px)}
.kicker{display:flex;align-items:center;gap:1em;font-family:var(--num);font-weight:700;font-stretch:87%;font-size:clamp(10px,1.9vh,15px);letter-spacing:.46em;margin-bottom:clamp(2px,.8vh,8px);animation:rise .6s .05s both}
.kicker::before{content:"";width:2.6em;height:2.5px;background:var(--ink)}
#title h1{font-family:var(--display);font-weight:900;font-size:clamp(48px,min(21vh,21.5vw),184px);line-height:1.02;color:var(--red);white-space:nowrap;letter-spacing:.02em;
  text-shadow:-.016em -.02em 0 #fff6de,.05em .06em 0 var(--ink);rotate:-3deg;transform-origin:0 100%;animation:rise .7s .15s both}
.sub{font-family:var(--note);font-size:clamp(14px,min(3.8vh,4.3vw),31px);letter-spacing:.14em;margin-top:clamp(4px,1.4vh,14px);padding-left:.25em;white-space:nowrap;animation:rise .7s .3s both}
.stamp{position:absolute;right:clamp(14px,5vw,84px);top:clamp(12px,5vh,54px);width:clamp(84px,20vh,156px);aspect-ratio:1;rotate:13deg;color:var(--ink);opacity:.8;animation:stampIn .5s .7s cubic-bezier(.2,1.6,.4,1) both}
.stamp svg{width:100%;height:100%;overflow:visible;display:block}
.ticket{position:absolute;right:clamp(14px,4.5vw,70px);bottom:clamp(14px,5.5vh,52px);background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:6px 7px 0 var(--ink);
  padding:clamp(12px,2.4vh,20px) clamp(16px,2.2vw,26px) clamp(10px,2vh,16px);rotate:1.6deg;animation:rise .7s .5s both}
.press{display:flex;align-items:center;gap:.35em;font-family:var(--display);font-weight:900;font-size:clamp(20px,4.2vh,32px);letter-spacing:.08em;white-space:nowrap}
.press em{font-style:normal;animation:nudge 1.1s ease-in-out infinite;display:inline-block;margin-left:.25em}
.keys{list-style:none;display:grid;gap:clamp(5px,1.1vh,9px);margin-top:clamp(10px,2.2vh,18px);padding-top:clamp(10px,2.2vh,18px);border-top:2.5px dashed rgba(28,42,77,.35);
  font-size:clamp(12px,2.2vh,16px);font-weight:500;letter-spacing:.05em;white-space:nowrap}
.keys li{display:flex;align-items:center;gap:.6em}
.keys li i{font-style:normal;opacity:.45}
kbd{display:inline-grid;place-items:center;min-width:2.2em;font-family:var(--num);font-weight:700;font-size:.82em;line-height:1.25;letter-spacing:.06em;padding:.2em .6em .14em;
  border-radius:.5em;background:#fff;color:var(--ink);border:2px solid var(--ink);box-shadow:0 .2em 0 var(--ink)}
.press kbd{font-size:.6em;background:var(--red);color:var(--paper);letter-spacing:.12em}
.tbest{margin-top:clamp(8px,1.8vh,14px);font-family:var(--note);font-weight:700;font-size:clamp(13px,2.4vh,17px);letter-spacing:.12em;color:var(--red)}
.tbest:empty{display:none}

#over{display:grid;place-items:center}
.card{position:relative;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:8px 9px 0 var(--ink);text-align:center;rotate:-1.6deg;
  padding:clamp(20px,4vh,32px) clamp(22px,3vw,38px) clamp(14px,3vh,24px);min-width:min(86vw,370px)}
body[data-mode="over"] .card{animation:drop .55s cubic-bezier(.2,1.5,.4,1) both}
.tape{position:absolute;left:50%;top:-15px;width:104px;height:28px;translate:-50% 0;rotate:2.5deg;background:rgba(245,181,50,.9);border:2.5px solid var(--ink);border-radius:3px}
.oops{font-family:var(--display);font-weight:900;font-size:clamp(40px,9vh,72px);line-height:1.05;color:var(--red);text-shadow:.045em .05em 0 var(--ink);letter-spacing:.06em}
.quip{font-family:var(--note);font-size:clamp(16px,3.1vh,23px);letter-spacing:.06em;margin-top:.45em}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:clamp(14px,2.8vh,22px) 0 clamp(10px,2vh,16px);border-top:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink)}
.stats div{padding:clamp(8px,1.6vh,13px) 8px clamp(6px,1.2vh,10px);border-left:2.5px dashed rgba(28,42,77,.3)}
.stats div:first-child{border-left:0}
.stats dt{font-size:clamp(11px,1.9vh,13px);font-weight:700;letter-spacing:.34em;padding-left:.34em;opacity:.65}
.stats dd{font-family:var(--num);font-weight:700;font-stretch:80%;font-size:clamp(28px,5.8vh,42px);line-height:1.15;font-variant-numeric:tabular-nums}
.stats dd small{font-family:var(--ui);font-size:.34em;font-weight:700;margin-left:.25em;opacity:.65}
.stats .total dd{color:var(--red)}
.bestline{display:flex;justify-content:center;align-items:center;gap:.6em;font-size:clamp(12px,2.1vh,15px);font-weight:700;letter-spacing:.16em;min-height:2em}
.bestline b{font-family:var(--num);font-size:1.35em;letter-spacing:.02em}
.rec{display:none;font-family:var(--display);font-weight:900;font-size:1.05em;letter-spacing:.14em;color:var(--paper);background:var(--red);border:2px solid var(--ink);border-radius:6px;padding:.12em .55em;rotate:-6deg;box-shadow:2px 2px 0 var(--ink)}
.rec.on{display:inline-block;animation:stampIn .4s .55s cubic-bezier(.2,1.6,.4,1) both}
.again{display:flex;justify-content:center;align-items:center;gap:.5em;margin-top:clamp(10px,2.4vh,18px);font-weight:700;font-size:clamp(13px,2.4vh,17px);letter-spacing:.1em;animation:nudge 1.1s ease-in-out infinite}

#pause{display:grid;place-items:center;background:rgba(28,42,77,.38)}
#pause p{font-family:var(--display);font-weight:900;font-size:clamp(48px,12vh,96px);color:var(--paper);text-shadow:.05em .06em 0 var(--ink);letter-spacing:.24em;padding-left:.24em;text-align:center}
#pause small{display:block;font-family:var(--ui);font-size:.2em;font-weight:700;letter-spacing:.24em;margin-top:1em;text-shadow:0 2px 0 var(--ink)}

#toast{position:fixed;left:50%;top:clamp(74px,18vh,136px);z-index:2;translate:-50% -12px;opacity:0;pointer-events:none;white-space:nowrap;
  font-family:var(--note);font-weight:700;font-size:clamp(17px,3.4vh,26px);letter-spacing:.14em;color:var(--ink);background:var(--paper);
  border:2.5px solid var(--ink);border-radius:999px;padding:.34em 1.2em .28em;box-shadow:0 4px 0 var(--ink);transition:opacity .25s,translate .25s}
#toast.show{opacity:1;translate:-50% 0}
#flash{position:fixed;inset:0;z-index:4;background:var(--paper);opacity:0;pointer-events:none}
#flash.go{animation:flash .45s ease-out}

@keyframes rise{from{opacity:0;translate:0 28px}to{opacity:1;translate:0 0}}
@keyframes nudge{0%,100%{translate:0 0}50%{translate:0 -4px}}
@keyframes drop{from{opacity:0;translate:0 -60px;scale:.9}to{opacity:1;translate:0 0;scale:1}}
@keyframes stampIn{from{opacity:0;scale:1.9}to{scale:1}}
@keyframes bump{0%{scale:1}40%{scale:1.16}100%{scale:1}}
@keyframes flash{from{opacity:.95}to{opacity:0}}
@media (max-width:640px){.stamp{display:none}}
@media (max-aspect-ratio:4/5){.ticket{bottom:auto;top:clamp(150px,33vh,330px)}.chip.best{display:none}}
@media (prefers-reduced-motion:reduce){.kicker,#title h1,.sub,.ticket,.stamp{animation:none}}
</style>
</head>
<body data-mode="title">
<canvas id="game" aria-label="鹈鹕骑车 游戏画面"></canvas>

<div id="hud">
  <div class="hud-l">
    <div class="meter"><b id="dist">0</b><i>m</i></div>
    <div class="chip" id="fishChip"><svg class="ico" viewBox="0 0 40 24"><path d="M2 12Q12 2 27 9L37 3 34 12 37 21 27 15Q12 22 2 12Z"/><circle cx="10" cy="10.5" r="1.9"/></svg><b id="fishN">0</b></div>
    <div class="dash" id="dashBar"><span></span>顺风冲刺</div>
  </div>
  <div class="hud-r">
    <div class="chip best">最高分 <b id="best">0</b></div>
    <button id="btnBell" class="rbtn" tabindex="-1" aria-label="按铃" title="按铃 (B)"><svg viewBox="0 0 24 24"><path d="M6.5 16.5h11l-1.4-2.3V10a4.1 4.1 0 0 0-8.2 0v4.2z"/><path d="M10.4 19.2a1.7 1.7 0 0 0 3.2 0"/><path d="M12 4.2v1.7"/></svg></button>
    <button id="btnMute" class="rbtn" tabindex="-1" aria-label="静音" title="静音 (M)"><svg viewBox="0 0 24 24"><path d="M4.5 9.8v4.4h3l4 3.3v-11l-4 3.3z"/><g class="a"><path d="M15 9.6a3.4 3.4 0 0 1 0 4.8"/><path d="M17.6 7.2a6.8 6.8 0 0 1 0 9.6"/></g><g class="b"><path d="M15.2 9.6l4.6 4.8M19.8 9.6l-4.6 4.8"/></g></svg></button>
    <button id="btnPause" class="rbtn" tabindex="-1" aria-label="暂停" title="暂停 (P)"><svg viewBox="0 0 24 24"><g class="a"><path d="M8.5 6v12M15.5 6v12"/></g><g class="b"><path d="M8.5 5.5l10 6.5-10 6.5z"/></g></svg></button>
  </div>
</div>

<section id="title" class="screen">
  <div class="tb">
    <p class="kicker">PELICAN ON A BICYCLE</p>
    <h1>鹈鹕骑车</h1>
    <p class="sub">一只鹈鹕，一辆车，一整条海岸线。</p>
  </div>
  <div class="stamp" aria-hidden="true">
    <svg viewBox="0 0 160 160">
      <defs><path id="stampArc" d="M80 80m-59 0a59 59 0 1 1 118 0a59 59 0 1 1-118 0"/></defs>
      <circle cx="80" cy="80" r="76" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <circle cx="80" cy="80" r="46" fill="none" stroke="currentColor" stroke-width="2"/>
      <text font-family='Bahnschrift,"Arial Narrow",sans-serif' font-weight="700" font-size="13.5" fill="currentColor"><textPath href="#stampArc" textLength="364" lengthAdjust="spacing">SEASIDE CYCLING CLUB ★ RIDE · JUMP · FLAP ★</textPath></text>
      <text x="80" y="76" text-anchor="middle" font-family='"Noto Serif SC","SimSun",serif' font-weight="900" font-size="25" fill="currentColor">海岸</text>
      <text x="80" y="104" text-anchor="middle" font-family='"Noto Serif SC","SimSun",serif' font-weight="900" font-size="25" fill="currentColor">骑行</text>
    </svg>
  </div>
  <div class="ticket">
    <p class="press"><kbd>空格</kbd><kbd>点击</kbd><em>出发</em></p>
    <ul class="keys">
      <li><kbd>空格</kbd>跳跃 <i>·</i> 按得久，跳得高</li>
      <li><kbd>再按</kbd>空中扑翅，二段跳</li>
      <li><kbd>B</kbd>按铃，吓跑海鸥</li>
      <li><kbd>P</kbd>暂停<i>·</i><kbd>M</kbd>静音</li>
    </ul>
    <p class="tbest" id="tBest"></p>
  </div>
</section>

<section id="over" class="screen">
  <div class="card">
    <div class="tape"></div>
    <p class="oops">摔啦！</p>
    <p class="quip" id="quip"></p>
    <dl class="stats">
      <div><dt>距离</dt><dd><b id="oDist">0</b><small>m</small></dd></div>
      <div><dt>小鱼</dt><dd><b id="oFish">0</b><small>条</small></dd></div>
      <div class="total"><dt>总分</dt><dd><b id="oScore">0</b></dd></div>
    </dl>
    <p class="bestline">最高分 <b id="oBest">0</b><span class="rec" id="newRec">新纪录</span></p>
    <p class="again"><kbd>空格</kbd><kbd>点击</kbd>再骑一次</p>
  </div>
</section>

<section id="pause" class="screen"><p>暂停<small>按 P 或点击继续</small></p></section>
<div id="toast"></div>
<div id="flash"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => 1 - Math.pow(1 - t, 3);
const mod = (a, n) => ((a % n) + n) % n;
const angLerp = (a, b, t) => a + (mod(b - a + PI, TAU) - PI) * t;
function hash(n) { let h = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function makeRng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const css = (c, a) => a === undefined ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

/* ---------- tuning ---------- */
const M = 40;                 // px per metre
const DT = 1 / 120;           // fixed simulation step
const GRAV = 2600, JUMP_V = 900, JUMP_CUT = 400, FLAP_V = 740;
const SPEED0 = 400, SPEED_MAX = 780, DASH_T = 4.2;
const CYCLE_M = 1500, PHASE0 = 0.2;   // a full day lasts 1500 m; runs start mid-morning
const INK = '#1c2a4d', INKC = hex(INK), PAPER = '#f6ecd6', RED = '#e5432a', REDC = hex(RED), TEALC = hex('#1d8a8c'), SUNC = '#f5b532', WHITE = '#fffdf6';
const NUMF = 'Bahnschrift,"DIN Alternate","Arial Narrow","Microsoft YaHei UI",sans-serif';

/* ---------- time-of-day palettes ---------- */
const key = (p, o) => { const r = { p }; for (const k in o) r[k] = typeof o[k] === 'string' ? hex(o[k]) : o[k]; return r; };
const DAWN = { skyTop: '#8fa6d6', skyBot: '#fbd3b0', sea1: '#86bfc4', sea2: '#3a8a9c', far: '#9a8fb5', mid: '#e2b68a', mid2: '#c4946c', sand: '#efcf9f', sand2: '#d5a877', path: '#94705a', grass: '#5d9b7c', cloud: '#ffe9d6', sun: '#ffe1b0', tint: '#ffb089', tintA: 0.07, night: 0.12 };
const NIGHT = { skyTop: '#0e1432', skyBot: '#33427b', sea1: '#2c4178', sea2: '#111a3f', far: '#19224e', mid: '#27335f', mid2: '#1d2850', sand: '#3d4a78', sand2: '#2b3560', path: '#1b2346', grass: '#24465a', cloud: '#46558e', sun: '#fff1cf', tint: '#1a2466', tintA: 0.32, night: 1 };
const KEYS = [
  key(0.00, DAWN),

  limb([BB, AX], 4, RED, 4.6);
  limb([[SEAT[0], SEAT[1] + 4], AX], 3.6, RED, 4.6);

  limb([BB, [SEAT[0] - 1.5, SEAT[1] - 6]], 4.6, RED, 4.6);
  limb([[SEAT[0], SEAT[1] + 2], [HEAD[0] + 1, HEAD[1] + 5]], 4.6, RED, 4.6);

  ctx.beginPath(); ctx.arc(BB[0], BB[1], 8.5, 0, TAU); fillInk(SUNC, 2.4); ctx.fillStyle = INK; disc(BB[0], BB[1], 2.6);
  ctx.beginPath(); ctx.moveTo(-37, -84); ctx.quadraticCurveTo(-36, -91, -24, -89); ctx.lineTo(-8, -88); ctx.quadraticCurveTo(-4, -86, -8, -84); ctx.quadraticCurveTo(-24, -80, -37, -84); ctx.closePath(); fillInk('#7b4a33', 2.4);
  ctx.beginPath(); ctx.moveTo(29.5, -96); ctx.quadraticCurveTo(37, -103, 27, -105); ctx.lineTo(14, -103);

  ctx.beginPath(); ctx.arc(33, -106, 4.6, PI, TAU); ctx.closePath(); fillInk(SUNC, 2);
  const tails = Math.min(3, Math.ceil(G.fish / 5));       // the catch piles up in the basket

    ctx.save(); ctx.translate(45 + i * 6.5, -96); ctx.rotate(-PI / 2 + (i - 1) * 0.3 + Math.sin(t * 9 + i * 2) * 0.25);
    ctx.beginPath(); ctx.moveTo(-4, 0); ctx.quadraticCurveTo(2, -4, 6, 0); ctx.lineTo(12, -5); ctx.lineTo(10.5, 0); ctx.lineTo(12, 5); ctx.lineTo(6, 0); ctx.quadraticCurveTo(2, 4, -4, 0); ctx.closePath(); fillInk('#5fc7d8', 2);
    ctx.restore();

  ctx.beginPath(); ctx.moveTo(38, -98); ctx.lineTo(64, -98); ctx.lineTo(61, -78); ctx.lineTo(41, -78); ctx.closePath(); fillInk('#dba95f', 2.4);
  ctx.strokeStyle = 'rgba(28,42,77,0.4)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(39, -91.5); ctx.lineTo(63, -91.5); ctx.moveTo(40, -85); ctx.lineTo(62, -85);
  for (let i = 1; i < 4; i++) { ctx.moveTo(38 + i * 6.5, -98); ctx.lineTo(41 + i * 5, -78); }
  ctx.stroke();
  ctx.beginPath(); ctx.moveTo(41, -78); ctx.lineTo(36, -70); ink(2.2);
  ctx.beginPath(); rr(61, -90, 8, 9, 3); fillInk(SUNC, 2.2);

  limb([BB, pedN], 2.4, '#5b6680', 3.2); ctx.fillStyle = INK; ctx.fillRect(pedN[0] - 7, pedN[1] - 2, 14, 4.5);
  limb([hipN, ik(hipN[0], hipN[1], footN[0], footN[1] - 3, 38, 40, -1), [footN[0], footN[1] - 3]], 6.5, '#f08a24');

  ctx.beginPath(); ctx.moveTo(-50, -99 + bob); ctx.bezierCurveTo(-47, -128 + bob, -22, -143 + bob, 0, -138 + bob); ctx.bezierCurveTo(17, -134 + bob, 23, -119 + bob, 17, -105 + bob);
  ctx.bezierCurveTo(10, -91 + bob, -8, -85 + bob, -24, -86 + bob); ctx.bezierCurveTo(-37, -87 + bob, -47, -91 + bob, -50, -99 + bob); ctx.closePath(); fillInk(WHITE, 2.8);
  ctx.save(); ctx.clip(); ctx.fillStyle = 'rgba(28,42,77,0.09)'; ctx.beginPath(); ctx.ellipse(-12, -84 + bob, 34, 13, -0.1, 0, TAU); ctx.fill(); ctx.restore();

  ctx.beginPath(); ctx.arc(hx, hy, 13, 0, TAU); fillInk(WHITE, 2.8);

  const open = crashed ? 0.9 : P.beak, jaw = open * 0.48, sag = 11.5 + P.pouch + P.gulp * 7 + open * 5 + Math.min(6, G.fish * 0.12);
  ctx.save(); ctx.translate(hx + 8.5, hy + 2.5); ctx.rotate(0.34 - look * 0.25 + (crashed ? 0.2 : 0));

  ctx.beginPath(); ctx.moveTo(-3, -7); ctx.quadraticCurveTo(28, -8.5, 56, -2.5); ctx.quadraticCurveTo(62, -0.5, 60.5, 6.5); ctx.quadraticCurveTo(57.5, 3.2, 52, 3); ctx.lineTo(-2, 2.5); ctx.closePath(); fillInk('#f6a02c', 2.5);
  ctx.beginPath(); ctx.moveTo(51, -3.8); ctx.quadraticCurveTo(62, -0.5, 60.5, 6.5); ctx.quadraticCurveTo(57.5, 3.2, 52, 3); ctx.closePath(); fillInk(RED, 2.2);
  ctx.strokeStyle = 'rgba(28,42,77,0.25)'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(8, -3); ctx.lineTo(44, -1.5); ctx.stroke();

function drawShadow() {

  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 9; ctx.globalAlpha = 0.75 * Math.min(1, G.dashT * 3);

/* ---------- frame ---------- */
const ZOOM = { k: 1, fx: 0.5, fy: 0.5 };   // inspection zoom about a screen point; 1 = normal play
function render() {

  for (const o of G.obstacles) if (!o.dead) drawObstacle(o);

const el = { dist: $('dist'), fish: $('fishN'), best: $('best'), dash: $('dashBar'), bell: $('btnBell'), chip: $('fishChip'), tbest: $('tBest') };
const hud = { dist: -1, fish: -1, best: -1, dash: -1, cd: null };
function syncHud() {
  if (G.runDist !== hud.dist) { hud.dist = G.runDist; el.dist.textContent = G.runDist; }
  if (G.fish !== hud.fish) {
    if (G.fish > hud.fish && hud.fish >= 0) { el.chip.classList.remove('bump'); void el.chip.offsetWidth; el.chip.classList.add('bump'); }
    hud.fish = G.fish; el.fish.textContent = G.fish;
  }
  if (G.best !== hud.best) { hud.best = G.best; el.best.textContent = G.best; el.tbest.textContent = G.best > 0 ? `最高分 ${G.best}` : ''; }

function frame(now) {

    acc += real; let n = 0;
    while (acc >= DT && n < 14) { update(DT); acc -= DT; n++; }
    if (n === 14) acc = 0;

  syncHud(); render();
}

/* ---------- input ---------- */
const isKey = (e, codes, keys) => codes.includes(e.code) || keys.includes(e.key);
const JUMP_CODES = ['Space', 'ArrowUp', 'KeyW', 'Enter'], JUMP_KEYS = [' ', 'Spacebar', 'ArrowUp', 'w', 'W', 'Enter'];
window.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (isKey(e, JUMP_CODES, JUMP_KEYS)) { e.preventDefault(); if (!e.repeat) press(); }
  else if (isKey(e, ['KeyB'], ['b', 'B'])) { if (!e.repeat) ring(); }
  else if (isKey(e, ['KeyP', 'Escape'], ['p', 'P', 'Escape'])) { if (!e.repeat) setPaused(!G.paused); }
  else if (isKey(e, ['KeyM'], ['m', 'M'])) { if (!e.repeat) toggleMute(); }

window.addEventListener('keyup', e => { if (isKey(e, JUMP_CODES, JUMP_KEYS)) { e.preventDefault(); release(); } });

for (const [id, fn] of [['btnBell', ring], ['btnMute', toggleMute], ['btnPause', () => setPaused(!G.paused)]]) $(id).addEventListener('click', e => { fn(); e.currentTarget.blur(); });

resize(); buildGrain();
P.y = groundY(P.x); G.camX = P.x - W * 0.26;

})();
